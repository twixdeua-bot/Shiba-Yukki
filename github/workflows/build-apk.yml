name: Build Shiba Yuki APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f shiba-yuki-twiksi.zip || { echo "::error::Archive shiba-yuki-twiksi.zip not found in repository root."; exit 1; }
          unzip -tq shiba-yuki-twiksi.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q shiba-yuki-twiksi.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then echo "::error::Gradle wrapper not found."; exit 1; fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        shell: bash
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH" || { echo "::error::APK was not generated."; exit 1; }
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiba-yuki-twiksi-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
