name: Build Shiba Yuki APK
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f shiba-yuki-twiksi.zip || { echo '::error::Upload shiba-yuki-twiksi.zip to the repository root.'; exit 1; }
          unzip -tq shiba-yuki-twiksi.zip
          mkdir -p source
          unzip -q shiba-yuki-twiksi.zip -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          test -n "$GRADLEW" || { echo '::error::Gradle wrapper (gradlew) was not found in the archive.'; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          test -f "$PROJECT_DIR/settings.gradle.kts" || { echo '::error::settings.gradle.kts was not found beside gradlew.'; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo '::error::app/build.gradle.kts was not found.'; exit 1; }
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH" || { echo '::error::APK was not generated.'; exit 1; }
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiba-yuki-twiksi-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
